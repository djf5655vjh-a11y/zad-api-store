services:
  - type: web
    name: zad-osint-api-store
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USER
        value: MAFIA
      - key: ADMIN_PASS
        sync: false        # type it in the Render dashboard (do not commit passwords)
      - key: DATABASE_URL
        sync: false        # free Postgres connection string (Neon) - keeps your data
